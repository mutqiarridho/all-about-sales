      body = '<div class="row"><span class="small muted">Cakupan data pola:</span><div class="chips">' + [['all', 'Semua data'], ['l90', '90 hari terakhir'], ['period', 'Periode terpilih']].map((k) => '<button class="chip" data-act="patscope" data-k="' + k[0] + '" aria-pressed="' + (S.opts.patternScope === k[0]) + '">' + k[1] + '</button>').join('') + '</div></div>' +
        (p.insufficient ? '<div class="card empty"><h3>Insufficient data to determine patterns</h3><p>Pola butuh minimal 14 hari valid. Saat ini ' + p.n + ' hari. Perlu tambahan catatan harian.</p></div>' : '<div class="stack">' + p.items.map((x) => '<article class="ins LOW"><div class="row"><h3 class="grow">' + esc(x.title) + '</h3>' + conf(x.confidence) + '</div><div class="ins-grid"><div class="ins-r wide"><span class="ins-k">METRIC</span><span class="ins-v">' + esc(x.metric) + ' · ' + esc(x.period) + '</span></div><div class="ins-r wide"><span class="ins-k">WHAT</span><span class="ins-v">' + esc(x.what) + '</span></div><div class="ins-r wide"><span class="ins-k">WHY (HIPOTESIS)</span><span class="ins-v">' + esc(x.why) + '</span></div><div class="ins-r wide"><span class="ins-k">COMPARISON</span><span class="ins-v">' + esc(x.comparison) + ' · p ≈ ' + F.n(x.p, 3) + '</span></div><div class="ins-r wide"><span class="ins-k">ACTION</span><span class="ins-v"><b>' + esc(x.action) + '</b></span></div></div></article>').join('') + (p.items.length ? '' : '<div class="card empty">Tidak ada pola dengan bukti cukup pada cakupan ini.</div>') + '</div>') +
        (p.hidden && p.hidden.length ? '<div class="small muted">' + p.hidden.length + ' pola dengan bukti lemah disembunyikan agar tidak menyesatkan.</div>' : '') +
        '<div class="callout info small">Pola menunjukkan keterkaitan (<i>associated with</i>), bukan sebab-akibat. Untuk menyimpulkan penyebab, cocokkan dengan catatan promo, event, dan staf.</div>';
    } else {
      const a = X.an;
      body = !a.ok ? '<div class="card empty"><h3>Insufficient data</h3><p>Anomali butuh baseline minimal 20 hari valid (saat ini ' + a.n + ').</p></div>' :
        '<div class="callout info small">Baseline: seluruh riwayat toko (' + a.n + ' hari valid), memakai median dan MAD (modified z-score ≥ 3,5). Menampilkan anomali pada <b>' + esc(X.R.A.label) + '</b>.</div>' +
        (a.items.length ? '<div class="stack">' + a.items.slice(0, 12).map((it) => {
          const h = it.hits.find((x) => x.k === 'net') || it.hits[0];
          const d = it.dec;
          return '<article class="ins ' + (it.dir === 'high' ? 'LOW' : 'MEDIUM') + '"><div class="row"><h3 class="grow">ANOMALY DETECTED · ' + F.date(it.r.date, true) + '</h3>' + pill(it.dir === 'high' ? 'Abnormal tinggi' : 'Abnormal rendah', it.dir === 'high' ? 'info' : 'warn') + '</div><div class="ins-grid">' +
            '<div class="ins-r wide"><span class="ins-k">WHAT</span><span class="ins-v">' + it.hits.map((x) => esc(x.label) + ' ' + esc(x.fmt(x.v)) + ' (' + F.spct(x.dev, 0) + ' vs median ' + esc(x.fmt(x.med)) + ')').join(' · ') + '</span></div>' +
            (d ? '<div class="ins-r wide"><span class="ins-k">DECOMPOSITION</span><span class="ins-v">Terhadap rata-rata toko: ' + d.factors.map((f) => esc(f.label.replace(/ \(.*\)/, '')) + ' ' + F.spct(f.chg, 0)).join(', ') + '. Indikasi: perubahan terbesar dari ' + esc(d.main.label.replace(/ \(.*\)/, '').toLowerCase()) + '.</span></div>' : '') +
            '<div class="ins-r wide"><span class="ins-k">CATATAN</span><span class="ins-v">' + (h.k === 'bs' && h.dev > 1 ? 'BS jauh di atas normal: kemungkinan pembelian bernilai besar (wholesale/korporat). ' : '') + 'Penyebab pasti tidak bisa disimpulkan dari data harian saja. Insufficient data to determine root cause; konfirmasi dengan catatan promo/event.</span></div></div></article>';
        }).join('') + '</div>' : '<div class="card empty">Tidak ada anomali pada periode ini.</div>');
    }
    return tabs('intel', [['feed', 'Insight feed'], ['pola', 'Pola tersembunyi'], ['anomali', 'Anomali']], 'feed') + body;
  };

  /* ================= SALES DRIVERS ================= */
  pages.drivers = (X) => {
    if (!X.dec) return need('Driver butuh periode pembanding dengan data');
    const d = X.dec, narr = X.narr;
    const tr = (f) => { const tg = C.tagFor(f); return '<tr><td>' + esc(f.label) + '</td><td>' + (f.key === 'traffic' ? n1(f.v0) : f.key === 'bs' ? rp(f.v0) : pct(f.v0)) + '</td><td>' + (f.key === 'traffic' ? n1(f.v1) : f.key === 'bs' ? rp(f.v1) : pct(f.v1)) + '</td><td class="' + (f.chg >= 0 ? 'pos' : 'neg') + '">' + F.spct(f.chg) + '</td><td class="' + (f.contrib >= 0 ? 'pos' : 'neg') + '">' + F.srp(f.contrib) + '</td><td class="' + (f.contrib >= 0 ? 'pos' : 'neg') + '">' + F.srp(f.rp) + '</td><td>' + F.spct(f.share, 0) + '</td><td><span class="pill ' + tg.cls + '">' + tg.text + '</span></td></tr>'; };
    const ms = X.months.filter((m) => m.days >= 14);
    let idx = '';
    if (ms.length >= 3) {
      const b0 = ms[0];
      const ix = (v, v0) => (v0 ? (v / v0) * 100 : null);
      idx = card('Traffic, CR, dan BS per bulan', 'Indeks: ' + F.ym(b0.ym) + ' = 100, satu sumbu agar adil', Ch.line({ labels: ms.map((m) => F.ym3(m.ym)), h: 230, yFmt: (v) => F.n(v, 0), valFmt: (v) => F.n(v, 0), series: [
        { name: 'Traffic/hari', color: 'var(--c-traffic)', data: ms.map((m) => ix(m.pd.inT, b0.pd.inT)) }, { name: 'CR', color: 'var(--c-cr)', data: ms.map((m) => ix(m.cr, b0.cr)) }, { name: 'BS', color: 'var(--c-bs)', data: ms.map((m) => ix(m.bs, b0.bs)) }], refs: [{ y: 100, label: 'basis' }] }) + legend([['Traffic/hari', 'var(--c-traffic)'], ['CR', 'var(--c-cr)'], ['BS', 'var(--c-bs)']]));
    }
    return card('SALES ' + (narr.state === 'up' ? 'NAIK' : narr.state === 'down' ? 'TURUN' : 'STABIL') + ' ' + F.spct(d.pct), esc(X.R.A.label) + ' vs ' + esc(X.R.B.label) + ' · rata-rata per hari', '<div class="callout ' + (narr.state === 'down' ? 'bad' : narr.state === 'up' ? 'good' : 'info') + '"><p class="quote">' + esc(narr.text) + '</p></div>' + driverBars(d) +
      '<div class="small muted">Dihitung dengan <b>Net Sales ≈ Traffic × CR × BS × (Net ÷ Gross)</b> dan dekomposisi logaritmik (LMDI): kontribusi tiap faktor dijumlah persis sama dengan perubahan sales, tanpa bergantung pada korelasi. CR = transaksi ÷ IN. BS = gross ÷ transaksi.</div>') +
      card('Rincian kontribusi', 'Net sales per hari: ' + rp(d.S0) + ' → ' + rp(d.S1) + ' (' + F.srp(d.delta) + '/hari, ' + F.srp(d.rpTotal) + ' pada ' + d.days + ' hari)', '<div class="scroll-x"><table class="tbl"><thead><tr><th>Faktor</th><th>Sebelum</th><th>Sekarang</th><th>Perubahan</th><th>Kontribusi/hari</th><th>Kontribusi periode</th><th>Porsi</th><th>Status</th></tr></thead><tbody>' + d.factors.map(tr).join('') + '</tbody></table></div>') +
      (d.bsSplit ? card('Di dalam BS: jumlah item atau harga per item?', 'BS = UPT × harga rata-rata per item', '<div class="grid g2"><div class="fact"><span class="k">UPT (item per transaksi)</span><span class="v">' + F.n(d.bsSplit.upt.v0, 2) + ' → ' + F.n(d.bsSplit.upt.v1, 2) + ' (' + F.spct(d.bsSplit.upt.chg) + ') · ' + F.srp(d.bsSplit.upt.contrib) + '/hari</span></div><div class="fact"><span class="k">Harga rata-rata per item</span><span class="v">' + rp(d.bsSplit.asp.v0) + ' → ' + rp(d.bsSplit.asp.v1) + ' (' + F.spct(d.bsSplit.asp.chg) + ') · ' + F.srp(d.bsSplit.asp.contrib) + '/hari</span></div></div>') : '') +
      idx + '<div class="stack">' + X.insights.filter((i) => i.id === 'driver').map((i) => insightCard(i)).join('') + '</div>';
  };

  /* ================= TIME ================= */
  const slotBars = (X, title, sub, f, color, fmtv, extra) => {
    const t = X.time, tb = X.timeB;
    const series = [{ name: X.R.A.label, color, data: t.slots.map(f) }];
    if (tb && tb.key === t.key) series.push({ name: X.R.B.label, color: 'var(--line2)', data: tb.slots.map((s, j) => f(s, j)) });
    return card(title, sub, Ch.bar(Object.assign({ labels: t.slots.map((s) => s.label.replace('–', '-')), h: 210, series, yFmt: fmtv, valFmt: fmtv, padL: 44 }, extra || {})) + legend(series.map((s) => [s.name, s.color])));
  };
  pages.time = (X) => {
    const t = X.time;
    if (!t) return '<div class="card empty"><h3>Tidak ada data per jam pada periode ini</h3><p>Catat IN dan transaksi per blok jam (opsional pada form Catat hari) atau upload Excel dengan blok jam.</p></div>';
    const multi = Object.keys(t.schemaCounts).length > 1;
    const sel = multi ? '<div class="card flat"><div class="row"><span class="small">Skema jam berbeda dalam periode ini:</span><select data-bind="schema" style="width:auto">' + Object.keys(t.schemaCounts).map((k) => '<option value="' + esc(k) + '"' + (k === t.key ? ' selected' : '') + '>' + esc((X.ds.schemas[k] || {}).labels ? X.ds.schemas[k].labels.join(' · ') : k) + ' (' + t.schemaCounts[k] + ' hari)</option>').join('') + '</select></div><div class="small muted">Blok jam berubah dari Jan–Jul (5 blok, 08:30–22:00) ke Agu+ (4 blok, 08:30–21:00). Hanya satu skema dibaca sekali agar tidak membandingkan jam yang berbeda.</div></div>' : '';
    const chip = (k, s, sub) => '<div class="fact"><span class="k">' + k + '</span><span class="v">' + (s ? esc(s.label) + (sub ? ' · ' + sub(s) : '') : '–') + '</span></div>';
    const facts = '<div class="grid g4">' + chip('Peak traffic hour', t.peakTraffic, (s) => n1(s.inPerHour) + ' IN/jam') + chip('Peak transaction hour', t.peakTrx, (s) => n1(s.trxPerHour) + ' trx/jam') + chip('Peak sales hour (estimasi)', t.peakSales, (s) => rpc(s.estNetPerHour) + '/jam') + chip('Dead hour', t.dead, (s) => n1(s.inPerHour) + ' IN/jam') + '</div>';
    const qd = { golden: ['High Traffic + High CR', []], convopp: ['High Traffic + Low CR', []], trafficopp: ['Low Traffic + High CR', []], critical: ['Low Traffic + Low CR', []] };
    t.slots.forEach((s) => { if (s.quad) qd[s.quad][1].push(s); });
    const quad = '<div class="quad">' + Object.keys(qd).map((k) => { const Q = C.QUAD[k]; return '<div class="q ' + Q.cls + '"><span class="cond">' + qd[k][0] + '</span><h4>' + Q.name + '</h4><div class="small"><b>' + (qd[k][1].length ? qd[k][1].map((s) => esc(s.label) + ' (' + n1(s.inPerHour) + ' IN/jam, CR ' + pct(s.cr, 0) + (s.marginal ? ', tipis' : '') + ')').join('; ') : 'Tidak ada blok jam') + '</b></div><div class="small">' + Q.rec + '</div></div>'; }).join('') + '</div>' + (t.slots.some((s) => s.low) ? '<div class="small muted">Blok dengan IN < 8 (' + t.slots.filter((s) => s.low).map((s) => s.label).join(', ') + ') terlalu kecil untuk diklasifikasi.</div>' : '');
    const tbl = '<div class="scroll-x"><table class="tbl"><thead><tr><th>Blok jam</th><th>IN</th><th>IN/hari</th><th>IN/jam</th><th>Trx</th><th>CR</th><th>Share traffic</th><th>Share trx</th><th>Est. net</th></tr></thead><tbody>' + t.slots.map((s) => '<tr><td>' + esc(s.label) + '</td><td>' + s.IN + '</td><td>' + n1(s.avgIN) + '</td><td>' + n1(s.inPerHour) + '</td><td>' + s.trx + '</td><td>' + pct(s.cr) + '</td><td>' + pct(s.shareIN, 0) + '</td><td>' + pct(s.shareTrx, 0) + '</td><td>' + rpc(s.estNet) + '</td></tr>').join('') + '</tbody></table></div>';
    const order = [1, 2, 3, 4, 5, 6, 0];
    const maxIN = Math.max(1, ...t.grid.flat().map((c) => c.avgIN || 0));
    const heat = (key, hc, fmtv, mx) => '<div class="heat" style="grid-template-columns:64px repeat(' + t.slots.length + ',minmax(0,1fr))"><span></span>' + t.slots.map((s) => '<span class="heat-h">' + esc(s.label.slice(0, 5)) + '</span>').join('') + order.map((d) => '<span class="heat-l">' + F.DAY3[d] + '</span>' + t.grid[d].map((c) => '<span class="heat-c" style="--hc:' + hc + ';--hi:' + (c[key] == null ? 0 : Math.min(1, c[key] / mx)) + '" title="' + F.DAYS[d] + ' · n=' + c.n + ' hari">' + (c[key] == null ? '–' : fmtv(c[key])) + '</span>').join('')).join('') + '</div>';
    return sel + facts +
      '<div class="grid g2">' + slotBars(X, 'Traffic by hour', 'Rata-rata IN per hari', (s) => s.avgIN, 'var(--c-traffic)', n1) + slotBars(X, 'Transaction by hour', 'Rata-rata transaksi per hari', (s) => s.trx / s.days, 'var(--c-trx)', n1) + '</div>' +
      '<div class="grid g2">' + slotBars(X, 'Sales by hour (estimasi)', 'Net harian dialokasikan sesuai porsi transaksi tiap blok. Sales per jam tidak dicatat langsung.', (s) => s.estNet / s.days, 'var(--c-sales)', (v) => (v >= 1e6 ? n1(v / 1e6) + ' jt' : F.n(v / 1e3) + ' rb'), { refs: [] }) +
      slotBars(X, 'CR by hour', 'Transaksi ÷ IN per blok. Garis = CR rata-rata blok.', (s) => s.cr, 'var(--c-cr)', (v) => pct(v, 0), { refs: [{ y: t.overallCR, label: 'rata-rata ' + pct(t.overallCR, 0), color: 'var(--ink2)' }], min: 0 }) + '</div>' +
      card('BS by hour', null, '<div class="callout info small">BS per jam tidak dapat dihitung karena omzet hanya dicatat per hari, tidak per blok jam. Untuk analisis ini, catat gross per blok jam atau pakai laporan POS per jam. (Insufficient data.) Sebagai pengganti, lihat BS per hari dalam seminggu di halaman Lost Sales.</div>') +
      card('Matriks traffic × conversion', 'Traffic dibaca per jam operasional; "tinggi" berarti di atas rata-rata blok. CR tinggi berarti di atas CR rata-rata (selisih < 1,5 pp ditandai tipis).', quad) +
      card('Detail per blok', null, tbl) +
      '<div class="grid g2">' + card('Heatmap traffic: hari × jam', 'Rata-rata IN per hari. Semakin pekat semakin ramai.', heat('avgIN', 'var(--c-traffic)', n1, maxIN)) + card('Heatmap CR: hari × jam', 'Semakin pekat semakin tinggi konversi.', heat('cr', 'var(--c-cr)', (v) => pct(v, 0), 1)) + '</div>' +
      '<div class="stack">' + X.insights.filter((i) => i.kind === 'time').map((i) => insightCard(i)).join('') + '</div>';
  };

  /* ================= LOST SALES ================= */
  pages.lost = (X) => {
    const L = X.lost;
    if (!L || !L.ok) return '<div class="card empty"><h3>Data belum cukup untuk menghitung lost sales</h3></div>';
    const real = S.settings.realization;
    const tile = (label, color, big, sub) => '<div class="kpi" style="--kc:' + color + '"><div class="kl"><span>' + label + '</span><i></i></div><div class="kv">' + big + '</div><div class="ks">' + sub + '</div></div>';
    const slider = '<div class="card flat"><div class="row slider-row"><label class="grow" for="real"><b>Asumsi realisasi:</b> ' + pct(real, 0) + ' dari gap benar-benar bisa dikejar</label><input id="real" class="range" data-bind="real" type="range" min="10" max="100" step="5" value="' + Math.round(real * 100) + '" style="max-width:260px"></div><div class="small muted">Angka "maks" adalah batas teoritis bila semua hari mencapai benchmark. Angka realistis = maks × realisasi.</div></div>';
    const caseLab = { 1: ['Case 1 · Traffic tinggi + CR rendah', 'warn', 'Conversion Opportunity: customer datang, tidak jadi transaksi.'], 2: ['Case 2 · Transaksi tinggi + BS rendah', 'warn', 'Transaksi ada, tetapi nilai belanja rendah.'], 3: ['Case 3 · Traffic rendah + CR sangat tinggi', 'info', 'Selling capability cukup baik. Opportunity terbesar berada pada traffic acquisition.'], 4: ['Case 4 · Traffic tinggi + CR tinggi + BS rendah', 'good', 'Customer berhasil dikonversi tetapi basket value masih rendah. Fokus: cross-selling, add-on selling, complementary products, bundling.'] };
    const wk = X.wd.filter((w) => w.days >= 1);
    const cases = L.cases.length ? '<div class="stack">' + L.cases.map((c) => { const cl = caseLab[c.type]; return '<div class="callout ' + cl[1] + '"><b>' + cl[0] + ' · ' + esc(c.name) + '</b><div class="small">' + esc(cl[2]) + ' (' + c.w.days + ' hari: ' + n1(c.w.inT / c.w.days) + ' IN/hari, CR ' + pct(c.w.cr, 0) + ', BS ' + rp(c.w.bs) + ')</div></div>'; }).join('') + '</div>' : '<div class="small muted">Tidak ada pola hari yang memenuhi Case 1–4 pada periode ini.</div>';
    const wtbl = '<div class="scroll-x"><table class="tbl"><thead><tr><th>Hari</th><th>Hari data</th><th>IN/hari</th><th>CR</th><th>Trx/hari</th><th>BS</th><th>Net/hari</th><th>Gap BS (maks)</th></tr></thead><tbody>' + wk.map((w) => { const gap = w.bs && L.bench.bs && w.bs < L.bench.bs ? w.trx * (L.bench.bs - w.bs) * (w.disc || 1) : 0; return '<tr><td>' + w.name + '</td><td>' + w.days + '</td><td>' + n1(w.inT / (w.daysIn || 1)) + '</td><td>' + pct(w.cr) + '</td><td>' + n1(w.pd.trx) + '</td><td>' + rp(w.bs) + '</td><td>' + rpc(w.pd.net) + '</td><td>' + (gap ? rpc(gap) : '–') + '</td></tr>'; }).join('') + '</tbody></table></div>';
    const slots = L.convSlots.length ? '<div class="scroll-x"><table class="tbl"><thead><tr><th>Blok jam</th><th>IN</th><th>CR</th><th>Transaksi hilang</th><th>Est. lost net</th></tr></thead><tbody>' + L.convSlots.map((s) => '<tr><td>' + esc(s.label) + '</td><td>' + s.IN + '</td><td>' + pct(s.cr) + '</td><td>' + n1(s.lostTrx) + '</td><td>' + rpc(s.lostNet) + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="small muted">Tidak ada blok jam dengan CR di bawah benchmark, atau data per jam belum ada.</div>';
    return slider + '<div class="grid g3">' +
      tile('Case 1 · Konversi', 'var(--c-cr)', rpc(L.conv.lostNet * real), 'maks ' + rpc(L.conv.lostNet) + ' · ' + n1(L.conv.lostTrx) + ' transaksi · ' + L.conv.daysBelow + ' hari di bawah CR ' + pct(L.bench.cr, 0)) +
      tile('Case 2 · Basket', 'var(--c-bs)', rpc(L.basket.realistic), 'maks ' + rpc(L.basket.potential) + ' · ' + L.basket.daysBelow + ' hari di bawah BS ' + rpc(L.bench.bs)) +
      tile('Traffic gap', 'var(--c-traffic)', rpc(L.traffic.realistic), 'maks ' + rpc(L.traffic.potential) + ' · ' + L.traffic.daysBelow + ' hari di bawah median ' + n1(L.bench.inMed) + ' IN') + '</div>' +
      '<div class="small muted">Ketiga peluang saling tumpang tindih, jadi tidak dijumlahkan. Benchmark = kuartil atas (P75) performa harian toko sendiri, bukan standar eksternal.</div>' +
      card('Case 1 · Traffic tinggi + CR rendah', 'Jika CR mencapai rata-rata terbaik toko (' + pct(L.bench.cr) + ') berapa transaksi dan sales tambahan?', '<div class="callout warn"><b>Estimated lost sales: ' + rpc(L.conv.lostNet) + '</b> (' + n1(L.conv.lostTrx) + ' transaksi × net per transaksi ' + rp(L.npt) + '). Realistis pada ' + pct(real, 0) + ': ' + rpc(L.conv.lostNet * real) + '.</div>' + slots) +
      card('Case 2 · Transaksi tinggi + BS rendah', 'Potensi bila BS hari-hari rendah naik ke benchmark ' + rp(L.bench.bs), '<div class="callout warn"><b>Potensi: ' + rpc(L.basket.potential) + '</b> maksimum, ' + rpc(L.basket.realistic) + ' realistis. Dari sisi UPT saja (naik ke ' + F.n(L.bench.upt, 2) + ' item): ' + rpc(L.uptGap) + ' realistis.</div>') +
      card('Case 3 & 4 · Pola per hari dalam seminggu', 'Dibaca dari rata-rata tiap hari', cases + wtbl) +
      '<div class="stack">' + X.insights.filter((i) => i.kind === 'lost').map((i) => insightCard(i)).join('') + '</div>';
  };

  /* ================= BEST & WORST ================= */
  pages.days = (X) => {
    const b = X.bw;
    if (!b.ok) return '<div class="card empty"><h3>Insufficient data</h3><p>Ranking butuh minimal 8 hari valid pada periode (saat ini ' + b.n + ').</p></div>';
    const rows = (arr) => arr.map((r, i) => '<tr><td>' + (i + 1) + '. ' + F.date(r.date, true) + '</td><td>' + rpc(r.net) + '</td><td>' + (r.inT == null ? '–' : r.inT) + '</td><td>' + (r.trxT == null ? '–' : r.trxT) + '</td><td>' + pct(r.cr) + '</td><td>' + rp(r.bs) + '</td><td>' + (r.units == null ? '–' : r.units) + '</td></tr>').join('');
    const head = '<thead><tr><th>Tanggal</th><th>Net sales</th><th>Traffic</th><th>Trx</th><th>CR</th><th>BS</th><th>PC</th></tr></thead>';
    const mt = '<div class="scroll-x"><table class="tbl"><thead><tr><th>Metrik</th><th>Rata-rata ' + b.k + ' terbaik</th><th>Rata-rata ' + b.k + ' terburuk</th><th>Selisih</th><th>Confidence</th></tr></thead><tbody>' + b.metrics.map((m) => { const f = m.name.startsWith('CR') || m.name.startsWith('Net') ? (v) => pct(v) : m.name.startsWith('BS') ? rp : (v) => F.n(v, 1); return '<tr><td>' + esc(m.name) + '</td><td>' + f(m.best) + '</td><td>' + f(m.worst) + '</td><td class="' + (m.diff >= 0 ? 'pos' : 'neg') + '">' + F.spct(m.diff, 0) + '</td><td>' + esc(m.conf) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    const d = b.dec, nr = C.driverNarrative(d);
    const dow = Ch.bar({ labels: [1, 2, 3, 4, 5, 6, 0].map((i) => F.DAY3[i]), h: 170, yFmt: (v) => String(v), valFmt: (v) => v + ' hari', padL: 30, series: [{ name: 'Top ' + b.k, color: 'var(--good)', data: [1, 2, 3, 4, 5, 6, 0].map((i) => b.dowBest[i]) }, { name: 'Worst ' + b.k, color: 'var(--bad)', data: [1, 2, 3, 4, 5, 6, 0].map((i) => b.dowWorst[i]) }] });
    const slot = b.slotShare ? '<div class="scroll-x"><table class="tbl"><thead><tr><th>Blok jam</th><th>IN/hari (terbaik)</th><th>IN/hari (terburuk)</th><th>CR (terbaik)</th><th>CR (terburuk)</th></tr></thead><tbody>' + b.slotShare.map((s) => '<tr><td>' + esc(s.label) + '</td><td>' + n1(s.bestIN) + '</td><td>' + n1(s.worstIN) + '</td><td>' + pct(s.bestCR, 0) + '</td><td>' + pct(s.worstCR, 0) + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="small muted">Data per jam tidak seragam pada kedua kelompok hari.</div>';
    const top = d ? d.ranked[0] : null;
    const answer = d ? 'Hari terbaik rata-rata menghasilkan net ' + rpc(d.S1) + ' vs ' + rpc(d.S0) + ' pada hari terburuk (' + F.spct(d.pct, 0) + '). Pembeda terbesar: <b>' + esc(top.label) + '</b> (' + F.spct(top.chg, 0) + '), diikuti ' + esc(d.ranked[1].label) + ' (' + F.spct(d.ranked[1].chg, 0) + '). Weekend: ' + b.weekendBest + ' dari ' + b.k + ' hari terbaik vs ' + b.weekendWorst + ' dari ' + b.k + ' hari terburuk.' : '';
    return card('Apa yang terjadi pada hari terbaik yang tidak terjadi pada hari terburuk?', 'Perbandingan ' + b.k + ' hari terbaik vs ' + b.k + ' hari terburuk berdasarkan net sales · ' + esc(X.R.A.label), '<div class="callout info"><p class="quote">' + answer + '</p></div>' + (d ? driverBars(d) : '') + '<div class="callout warn small"><b>Batas analisis:</b> data harian hanya menunjukkan <i>apa yang berbeda</i> (traffic, CR, BS, jam). Alasan di balik perbedaan itu (promo, event, cuaca, staf) tidak tercatat. Insufficient data to determine root cause; catat kejadian harian agar bisa dicocokkan.</div>') +
      '<div class="grid g2">' + card('Top ' + b.k + ' hari terbaik', null, '<div class="scroll-x"><table class="tbl">' + head + '<tbody>' + rows(b.best) + '</tbody></table></div>') + card('Worst ' + b.k + ' hari terburuk', null, '<div class="scroll-x"><table class="tbl">' + head + '<tbody>' + rows(b.worst) + '</tbody></table></div>') + '</div>' +
      card('Perbedaan metrik', 'Welch t-test untuk confidence; sampel kecil membuat banyak selisih belum meyakinkan.', mt) +
      '<div class="grid g2">' + card('Hari dalam seminggu', 'Sebaran hari terbaik dan terburuk', dow + legend([['Top', 'var(--good)'], ['Worst', 'var(--bad)']])) + card('Blok jam', 'Pola traffic dan CR', slot) + '</div>' +
      '<div class="small muted">Konsistensi: variasi net sales harian (CV) ' + F.n(b.cv, 2) + '; median Rp ' + F.n(b.median) + '/hari.</div>';
  };

  /* ================= MONTHLY ================= */
  pages.monthly = (X) => {
    const rows = X.months;
    const tbl = '<div class="scroll-x"><table class="tbl"><thead><tr><th>Bulan</th><th>Hari</th><th>Net sales</th><th>Growth/hari</th><th>Traffic</th><th>CR</th><th>BS</th><th>UPT</th><th>Transaksi</th><th>Target</th><th>Capaian</th></tr></thead><tbody>' + rows.map((m) => '<tr' + (m.ym === X.tmonth ? ' class="hl"' : '') + '><td>' + F.ym(m.ym) + (m.partial ? ' <span class="pill warn">berjalan</span>' : '') + '</td><td>' + m.days + '</td><td>' + rpc(m.net) + '</td><td class="' + (m.growth == null ? '' : m.growth >= 0 ? 'pos' : 'neg') + '">' + (m.growth == null ? '–' : F.spct(m.growth)) + '</td><td>' + F.n(m.inT) + '</td><td>' + pct(m.cr) + '</td><td>' + rp(m.bs) + '</td><td>' + F.n(m.upt, 2) + '</td><td>' + F.n(m.trx) + '</td><td>' + (m.target ? rpc(m.target) : '–') + '</td><td class="' + (m.ach == null ? '' : m.ach >= 1 ? 'pos' : 'neg') + '">' + (m.ach == null ? '–' : pct(m.ach, 0)) + '</td></tr>').join('') + '</tbody></table></div><div class="small muted">Growth dihitung dari net sales per hari agar bulan berjalan tidak dibandingkan dengan bulan penuh. Capaian memakai basis ' + (S.settings.targetBasis === 'net' ? 'Net' : 'Gross') + ' (sesuai pengaturan).</div>';
    const full = rows.filter((m) => m.days >= 1);
    const lbl = full.map((m) => F.ym3(m.ym));
    const full14 = rows.filter((m) => m.days >= 10);
    const l14 = full14.map((m) => F.ym3(m.ym));
    const sales = Ch.bar({ labels: lbl, h: 230, yFmt: (v) => F.n(v / 1e6) + ' jt', valFmt: rpc, series: [{ name: 'Net sales', color: 'var(--c-sales)', data: full.map((m) => m.net) }], marks: [{ name: 'Target (' + (S.settings.targetBasis === 'net' ? 'net' : 'gross') + ')', color: 'var(--ink)', data: full.map((m) => m.target) }], padL: 52 });
    const mini = (title, color, f, fmtv) => card(title, null, Ch.line({ labels: l14, h: 170, yFmt: fmtv, valFmt: fmtv, series: [{ name: title, color, data: full14.map(f), area: true }] }));
    const story = rows.filter((m) => m.story).map((m) => '<li>' + esc(m.story) + '</li>').join('');
    const yrs = Array.from(new Set(X.P.map((r) => +r.date.slice(0, 4))));
    const y0 = yrs[yrs.length - 1] || 2026;
    const tg = '<div class="scroll-x"><table class="tbl"><thead><tr><th>Bulan</th><th>Target sales bulanan (Rp)</th><th>Aktual (' + (S.settings.targetBasis === 'net' ? 'Net' : 'Gross') + ')</th><th>Capaian</th><th>Minus / Surplus</th></tr></thead><tbody>' + F.MONTHS.map((nm, i) => { const ym = y0 + '-' + String(i + 1).padStart(2, '0'); const m = rows.find((r) => r.ym === ym); const t = X.targets[ym]; const act = m ? m.basis : 0; return '<tr><td>' + nm + '</td><td><input type="number" inputmode="numeric" min="0" step="1000000" id="tg-' + ym + '" data-bind="target:' + ym + '" value="' + (t || '') + '" placeholder="isi target"></td><td>' + (m ? rpc(act) : '–') + '</td><td>' + (t && m ? pct(act / t, 0) : '–') + '</td><td class="' + (t && m ? (act >= t ? 'pos' : 'neg') : '') + '">' + (t && m ? (act >= t ? '+' : '−') + rpc(Math.abs(act - t)) : '–') + '</td></tr>'; }).join('') + '</tbody></table></div><div class="small muted">Isi target tiap bulan. Nilai dari Excel sudah terisi otomatis dan bisa diubah. Selisih "minus" langsung terlihat di sini.</div>';
    return card('Monthly performance', 'Seluruh bulan pada data', tbl) +
      card('Monthly sales trend', 'Batang = net sales, garis tebal = target', sales + legend([['Net sales', 'var(--c-sales)'], ['Target', 'var(--ink)']])) +
      '<div class="grid g3">' + mini('Traffic per hari', 'var(--c-traffic)', (m) => m.pd.inT, n1) + mini('CR', 'var(--c-cr)', (m) => m.cr, (v) => pct(v, 0)) + mini('BS', 'var(--c-bs)', (m) => m.bs, (v) => F.n(v / 1e3) + ' rb') + '</div>' +
      card('Monthly story', 'Dibuat otomatis dari dekomposisi tiap bulan terhadap bulan sebelumnya', '<ul class="stack" style="margin:0;padding-left:18px">' + (story || '<li>Perlu minimal dua bulan data.</li>') + '</ul>') +
      card('Target bulanan', 'Isi target agar terlihat masih minus berapa', tg);
  };

  /* ================= PICA ================= */
  function picaText(X, lang) {
    const p = X.pica[lang];
    if (!p) return '';
    const en = lang === 'en';
    return ['PICA · EIGER WONOSARI · ' + X.R.A.label + ' vs ' + X.R.B.label, '', (en ? 'PROBLEM IDENTIFICATION' : 'PROBLEM IDENTIFICATION'), p.problem, '', 'ROOT CAUSE', p.root, '', 'CORRECTIVE ACTION', p.corr, '', 'EXPECTED IMPACT', p.exp, '', 'KPI', p.kpi].join('\n');
  }
  UI.picaText = picaText;
  pages.pica = (X) => {
    if (!X.R.B) return need('PICA butuh periode pembanding');
    const lang = S.pica.lang, p = X.pica[lang];
    const head = '<div class="row"><div class="tabs"><button data-act="picalang" data-k="id" aria-selected="' + (lang === 'id') + '">Bahasa Indonesia</button><button data-act="picalang" data-k="en" aria-selected="' + (lang === 'en') + '">English</button></div><button class="btn pri right" data-act="picagen">GENERATE PICA</button></div>';
    if (!S.pica.shown || !p) return head + '<div class="card empty"><h3>Siap membuat PICA</h3><p>Tekan <b>Generate PICA</b> untuk menyusun Problem Identification, Root Cause, Corrective Action, Expected Impact, dan KPI dari data ' + esc(X.R.A.label) + ' vs ' + esc(X.R.B.label) + '.</p></div>';
    const sec = (t, b) => '<div class="pica-s"><h4>' + t + '</h4><div class="copybox">' + esc(b) + '</div></div>';
    return head + card('PICA · ' + esc(X.R.A.label) + ' vs ' + esc(X.R.B.label), 'Siap ditempel ke PPT Store Head. Hipotesis memakai kata "indikasi" karena data bukan bukti sebab-akibat.', sec('Problem Identification', p.problem) + sec('Root Cause', p.root) + sec('Corrective Action', p.corr) + sec('Expected Impact', p.exp) + sec('KPI', p.kpi), '<div class="row right"><button class="btn sm" data-act="picacopy">' + ico('copy', '') + ' Salin</button><button class="btn sm" data-act="picadl">' + ico('dl', '') + ' Unduh .txt</button></div>') + (p.ok ? '' : '<div class="callout warn small">Data pembanding atau periode terlalu pendek (di bawah 7 hari) sehingga akar masalah ditandai <i>insufficient data</i>.</div>');
  };

  /* ================= SIMULATOR ================= */
  function simBaseFromX(X) {
    const a = X.a;
    return { traffic: Math.round(a.inT), cr: a.cr, bs: Math.round(a.bs), disc: a.disc || 1 };
  }
  UI.simInit = function (X, force) {
    if (!S.sim || force) S.sim = { base: simBaseFromX(X), sc: { trafficPct: 0.1, crAdd: 0.02, crMode: 'pp', bsPct: 0.05 }, example: false };
  };
  pages.sim = (X) => {
    if (!X || X.empty) return '<div class="card empty">Belum ada data.</div>';
    UI.simInit(X);
    const s = S.sim, b = s.base, sc = s.sc;
    const chips = (name, vals, cur, fmtv) => '<div class="chips">' + vals.map((v) => '<button class="chip" data-act="simchip" data-k="' + name + '" data-v="' + v + '" aria-pressed="' + (Math.abs(cur - v) < 1e-9) + '">' + fmtv(v) + '</button>').join('') + '</div>';
    return '<div class="grid g2"><section class="card"><div class="card-h"><div class="grow"><h3>Kondisi saat ini</h3><div class="sub">Default dari ' + esc(X.R.A.label) + '. Bisa diubah.</div></div><button class="btn sm" data-act="simreset">Reset ke data</button><button class="btn sm" data-act="simexample">Contoh 500 / 20% / 600rb</button></div>' +
      '<div class="form-g"><label class="fld"><span>Traffic (IN)</span><input id="sim-t" data-bind="sim.t" type="number" inputmode="decimal" class="inp-big" value="' + b.traffic + '"></label><label class="fld"><span>CR (%)</span><input id="sim-c" data-bind="sim.c" type="number" inputmode="decimal" step="0.1" class="inp-big" value="' + (b.cr * 100).toFixed(1) + '"></label><label class="fld"><span>BS (Rp)</span><input id="sim-b" data-bind="sim.b" type="number" inputmode="numeric" class="inp-big" value="' + b.bs + '"></label><label class="fld"><span>Net ÷ Gross (%)</span><input id="sim-d" data-bind="sim.d" type="number" inputmode="decimal" step="0.1" class="inp-big" value="' + (b.disc * 100).toFixed(1) + '"></label></div>' +
      '<div class="small muted">Gross = Traffic × CR × BS. Net = Gross × (Net ÷ Gross). CR = transaksi ÷ IN, BS = gross ÷ transaksi.</div></section>' +
      '<section class="card"><div class="card-h"><h3>Skenario</h3></div><div class="stack"><div><div class="small"><b>Traffic</b> <span id="v-t">' + F.spct(sc.trafficPct, 0) + '</span></div>' + chips('trafficPct', [0, 0.05, 0.1, 0.2], sc.trafficPct, (v) => F.spct(v, 0)) + '<input id="sim-ts" class="range" data-bind="sim.ts" type="range" min="-30" max="50" step="1" value="' + Math.round(sc.trafficPct * 100) + '" aria-label="Perubahan traffic"></div>' +
      '<div><div class="small"><b>CR</b> <span id="v-c">' + (sc.crMode === 'pp' ? F.pp(sc.crAdd, 0) : F.spct(sc.crAdd, 0)) + '</span> <button class="btn sm ghost" data-act="simcrmode" title="Ganti satuan">' + (sc.crMode === 'pp' ? 'poin persentase' : 'relatif %') + '</button></div>' + chips('crAdd', [0, 0.01, 0.03, 0.05], sc.crAdd, (v) => (sc.crMode === 'pp' ? '+' + v * 100 + ' pp' : F.spct(v, 0))) + '<input id="sim-cs" class="range" data-bind="sim.cs" type="range" min="-10" max="20" step="1" value="' + Math.round(sc.crAdd * 100) + '" aria-label="Perubahan CR"></div>' +
      '<div><div class="small"><b>BS</b> <span id="v-b">' + F.spct(sc.bsPct, 0) + '</span></div>' + chips('bsPct', [0, 0.05, 0.1, 0.15], sc.bsPct, (v) => F.spct(v, 0)) + '<input id="sim-bs" class="range" data-bind="sim.bs" type="range" min="-20" max="40" step="1" value="' + Math.round(sc.bsPct * 100) + '" aria-label="Perubahan BS"></div></div></section></div>' +
      '<div id="sim-out">' + simOut() + '</div>';
  };
  function simOut() {
    const s = S.sim, r = C.simulate(s.base, s.sc);
    const eff = [['Traffic', r.effNet.traffic, 'var(--c-traffic)'], ['CR', r.effNet.cr, 'var(--c-cr)'], ['BS', r.effNet.bs, 'var(--c-bs)']];
    const mx = Math.max(1, ...eff.map((e) => Math.abs(e[1])));
    const tile = (l, c, v, sub) => '<div class="kpi" style="--kc:' + c + '"><div class="kl"><span>' + l + '</span><i></i></div><div class="kv">' + v + '</div><div class="ks">' + sub + '</div></div>';
    return '<div class="grid g4">' + tile('Current sales', 'var(--ink2)', rp(r.net0), 'Gross ' + rp(r.gross0) + ' · ' + F.n(r.trx0, 0) + ' transaksi') + tile('Projected sales', 'var(--c-sales)', rp(r.net1), 'Gross ' + rp(r.gross1) + ' · ' + F.n(r.trx1, 0) + ' transaksi') + tile('Potential upside', r.upsideNet >= 0 ? 'var(--good)' : 'var(--bad)', F.srp(r.upsideNet), F.spct(r.net0 ? r.net1 / r.net0 - 1 : 0) + ' · gross ' + F.srp(r.upside)) + tile('Skenario', 'var(--c-trx)', 'T ' + F.n(r.traffic, 0) + ' · CR ' + pct(r.cr) + ' · BS ' + rpc(r.bs), 'Traffic × CR × BS') + '</div>' +
      card('Dari mana tambahan sales datang?', 'Net sales; urutan kontribusi dihitung adil (logaritmik), bukan berurutan', '<div class="dv">' + eff.map((e) => '<div class="dv-row"><div class="dv-l">' + e[0] + '</div><div class="dv-track"><span class="dv-bar" style="' + (e[1] >= 0 ? 'left:50%;' : 'right:50%;') + 'width:' + Math.min(50, Math.abs(e[1]) / mx * 50) + '%;background:' + e[2] + '"></span></div><div class="dv-v"><b>' + F.srp(e[1]) + '</b></div></div>').join('') + '</div>');
  }
  UI.simOut = simOut;

  /* ================= TARGET SIMULATOR ================= */
  UI.tgInit = function (X, force) {
    if (!S.tg || force) S.tg = { ym: X.tmonth, base: 'l30', custom: null };
  };
  function tgBlock(X) {
    const tg = S.tg, st = S.settings;
    const ym = tg.ym;
    const ts = C.targetStatus(ym, X.months, st, X.targets);
    const basisName = st.targetBasis === 'net' ? 'Net' : 'Gross';
    const P = X.P;
    let baseRecs;
    if (tg.base === 'l30') baseRecs = P.filter((r) => r.date >= F.addDays(P[P.length - 1].date, -29));
    else if (tg.base === 'period') baseRecs = X.R.A.recs;
    else baseRecs = (X.months.find((m) => m.ym === ym) || { recs: X.R.A.recs }).recs;
    const ba = C.agg(baseRecs);
    const rem = ts.remaining > 0 ? ts.remaining : 0;
    const needed = ts.target ? Math.max(0, ts.target - ts.actual) : 0;
    const days = tg.days != null ? tg.days : rem || ts.dim;
    const tAmt = tg.amount != null ? tg.amount : ts.target ? (rem ? needed : ts.target) : 0;
    const full = X.months.filter((m) => m.days >= 20);
    const hist = { traffic: Math.max(...full.map((m) => m.pd.inT), ba.pd.inT), cr: Math.max(...full.map((m) => m.cr || 0), ba.cr), bs: Math.max(...full.map((m) => m.bs || 0), ba.bs) };
    const disc = st.targetBasis === 'net' ? ba.disc || 1 : 1;
    const baseDay = { traffic: ba.pd.inT, cr: ba.cr, bs: ba.bs };
    const Tper = tAmt / (days || 1) / disc;
    const r = tAmt > 0 ? C.reverseTarget(baseDay, Tper, hist) : null;
    const prog = ts.target ? '<div class="bar-h"><i style="width:' + Math.min(100, ts.ach * 100) + '%;background:' + (ts.ach >= 1 ? 'var(--good)' : 'var(--c-sales)') + '"></i>' + (ts.partial ? '<b style="left:' + Math.min(99, 100 * ts.elapsed / ts.dim) + '%" title="Pace ideal"></b>' : '') + '</div>' : '';
    const stat = '<div class="grid g4"><div class="fact"><span class="k">Target ' + basisName + '</span><span class="v">' + (ts.target ? rp(ts.target) : 'belum diisi') + '</span></div><div class="fact"><span class="k">Tercapai</span><span class="v">' + rp(ts.actual) + (ts.target ? ' · ' + pct(ts.ach, 0) : '') + '</span></div><div class="fact"><span class="k">' + (ts.gap != null && ts.gap >= 0 ? 'Surplus' : 'Masih minus') + '</span><span class="v ' + (ts.gap >= 0 ? 'pos' : '') + '">' + (ts.target ? rp(Math.abs(ts.gap)) : '–') + '</span></div><div class="fact"><span class="k">Butuh per hari (' + rem + ' hari lagi)</span><span class="v">' + (ts.target && rem ? rp(ts.needPerDay) : '–') + '</span></div></div>' + (ts.target && ts.partial ? '<div class="small muted">Run-rate ' + rp(ts.runPerDay) + '/hari → proyeksi akhir bulan ' + rpc(ts.projection) + ' (' + pct(ts.projAch, 0) + ' dari target). Batang: garis hitam = pace ideal hari ini.</div>' : '');
    let opts = '';
    if (r) {
      const rows = [];
      rows.push(['A', 'Traffic driven', 'CR dan BS tetap', 'Traffic ' + n1(r.A.traffic) + ' IN/hari (' + F.spct(r.A.chg, 1) + ') dari ' + n1(baseDay.traffic), 'var(--c-traffic)']);
      rows.push(['B', 'Conversion driven', 'Traffic dan BS tetap', r.B.feasible ? 'CR ' + pct(r.B.cr) + ' (' + F.pp(r.B.pp) + ', relatif ' + F.spct(r.B.chg, 1) + ') dari ' + pct(baseDay.cr) : 'CR yang dibutuhkan ' + pct(r.B.cr) + ' melebihi 100%, tidak mungkin dengan traffic dan BS saat ini', 'var(--c-cr)']);

      steps[0].st = 'done';

  async function importApply(mode) {
    const incoming = S.pending.ds;

      S.ds = { records: incoming.records, schemas: incoming.schemas, targets: incoming.targets, recap: incoming.recap, sheets: incoming.sheets, fileName: incoming.fileName, parseIssues: incoming.parseIssues, skipped: [] };
    } else {
      const map = new Map(cur.records.map((r) => [r.date, r]));
      incoming.records.forEach((r) => map.set(r.date, r));
      cur.records = Array.from(map.values()).sort((a, b) => (a.date < b.date ? -1 : 1));
      Object.assign(cur.schemas, incoming.schemas); Object.assign(cur.targets, incoming.targets);

    if (b === 'sim.t') { S.sim.base.traffic = +t.value || 0; simLive(); }
    else if (b === 'sim.c') { S.sim.base.cr = Math.min(1, Math.max(0.001, (+t.value || 0) / 100)); simLive(); }
    else if (b === 'sim.b') { S.sim.base.bs = +t.value || 0; simLive(); }
    else if (b === 'sim.d') { S.sim.base.disc = Math.min(1.2, Math.max(0.1, (+t.value || 0) / 100)); simLive(); }
    else if (b === 'sim.ts') { S.sim.sc.trafficPct = +t.value / 100; simLive(); }
    else if (b === 'sim.cs') { S.sim.sc.crAdd = +t.value / 100; simLive(); }
    else if (b === 'sim.bs') { S.sim.sc.bsPct = +t.value / 100; simLive(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'file-in') { handleFile(t.files[0]); t.value = ''; return; }
    if (t.id === 'json-in') { importJson(t.files[0]); t.value = ''; return; }
    if (t.id === 'cap-date') { const d = t.value; const ex = S.ds.records.find((r) => r.date === d); if (ex && !S.cap.ex) { /* keep typed values */ } return; }
    const b = t.getAttribute && t.getAttribute('data-bind');
    if (!b) return;
    const v = t.type === 'checkbox' ? t.checked : t.value;
    if (b.indexOf('f.') === 0) return UI.bind(b, v);
    if (b === 'schema') { S.opts.schemaKey = v; return UI.refresh(); }
    if (b === 'recym') { S.recYM = v; return UI.render(); }
    if (b === 'real') { S.settings.realization = +v / 100; saveMeta(); return UI.refresh(); }
    if (b.indexOf('target:') === 0) { const ym = b.slice(7); const n = num(v); if (n == null || n <= 0) delete S.targetsUser[ym]; else S.targetsUser[ym] = n; saveMeta(); if (S.page === 'target') { UI.recompute(); tgRender(); } else UI.refresh(); return toast('Target ' + F.ym(ym) + ' disimpan.'); }
    if (b.indexOf('set.') === 0) {
      if (b === 'set.cr') S.settings.crTarget = Math.min(1, Math.max(0.05, num(v) / 100));
      if (b === 'set.bs') S.settings.bsTarget = Math.max(0, num(v) || 0);
      if (b === 'set.upt') S.settings.uptTarget = Math.max(0, num(v) || 0);
      if (b === 'set.basis') S.settings.targetBasis = v;
      if (b === 'set.excl') S.settings.excludeBad = !!v;
      saveMeta(); UI.refresh(); return;
    }
    if (b.indexOf('tg.') === 0) {
      if (b === 'tg.ym') { S.tg.ym = v; S.tg.amount = null; S.tg.days = null; }
      else if (b === 'tg.base') S.tg.base = v;
      else if (b === 'tg.amt') S.tg.amount = num(v) || 0;
      else if (b === 'tg.days') S.tg.days = Math.max(1, num(v) || 1);
      tgRender(); Ch.mountAll(); return;
    }
    if (b.indexOf('sim.') === 0) { UI.render(); }
  });
  document.addEventListener('dragover', (e) => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', (e) => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); handleFile(e.dataTransfer.files[0]); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') UI.closeOverlay(); });

  /* ---------- boot ---------- */
  async function boot() {
    const th = Store.pref.get('theme', null);
    if (th) document.documentElement.setAttribute('data-theme', th);
    S.ds = JSON.parse(JSON.stringify(root.SEED));
    S.filter = UI.defaultFilter(S.ds);
    const hash = (location.hash || '').replace('#', '');
    if (UI.pages[hash]) S.page = hash;
    UI.recompute(); UI.render();
    try {
      S.storeMode = await Store.init();
      const saved = await Store.load();
      if (saved) {
        const m = saved.meta || {};
        if (m.settings) { S.settings = Object.assign({}, C.DEFAULTS, m.settings); if (m.setVer !== 2) { S.settings.bsTarget = C.DEFAULTS.bsTarget; S.settings.uptTarget = C.DEFAULTS.uptTarget; } }
        if (m.targets) S.targetsUser = m.targets;
        if (m.hasData) {
          const recs = [];
          Object.keys(saved.months).sort().forEach((ym) => saved.months[ym].forEach((r) => recs.push(r)));
          recs.sort((a, b) => (a.date < b.date ? -1 : 1));
          S.ds = { records: recs, schemas: m.schemas || {}, targets: m.dsTargets || {}, recap: m.recap, sheets: m.sheets || [], fileName: m.fileName, parseIssues: m.parseIssues || [], skipped: [] };
          S.hasSnapshot = true;
        }
        S.filter = UI.defaultFilter(S.ds);
        toast('Data tersimpan dimuat.');
      }
    } catch (e) { console.warn('boot store', e); }
    UI.recompute(); UI.render();
  }
  UI.afterRender = UI.afterRender || function () {};
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);

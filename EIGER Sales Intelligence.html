<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EIGER Sales Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* Layout: fixed navy rail + wide canvas of colour-coded metric cards; phones get a bottom tab bar. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface2: #f5f7fb; --ink: #0f1a2e; --ink2: #44546d; --muted: #7a8699; --line: #dde3ec; --line2: #c9d2df;
  --brand: #f25c05; --brand-ink: #ffffff; --side: #0d1b33; --side-ink: #b9c4d8; --side-act: #1b2f52; --side-line: #1d2e4c;
  --c-sales: #f25c05; --c-traffic: #0f9d8a; --c-trx: #6c4df0; --c-cr: #d9a400; --c-bs: #2d7ff9; --c-upt: #e0457b;
  --good: #14804a; --good-bg: #e2f5ea; --warn: #9a6200; --warn-bg: #fdf0d3; --bad: #c4291c; --bad-bg: #fde6e3; --info: #1d5fd0; --info-bg: #e3edfd;
  --shadow: 0 1px 2px rgba(15, 26, 46, .05), 0 6px 20px rgba(15, 26, 46, .05);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1220; --surface: #121c2e; --surface2: #17233a; --ink: #eaf0fa; --ink2: #aebad0; --muted: #7d8aa1; --line: #24324c; --line2: #33445f;
    --brand: #ff7a2e; --side: #08101e; --side-ink: #9eacc4; --side-act: #16233b; --side-line: #172640;
    --c-sales: #e8641a; --c-traffic: #16a08b; --c-trx: #8a74f2; --c-cr: #bd8e00; --c-bs: #4a8ef5; --c-upt: #e5588a;
    --good: #45c486; --good-bg: #123626; --warn: #f0b64a; --warn-bg: #3a2c0c; --bad: #ff8478; --bad-bg: #3d1713; --info: #7fb0ff; --info-bg: #14284b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1220; --surface: #121c2e; --surface2: #17233a; --ink: #eaf0fa; --ink2: #aebad0; --muted: #7d8aa1; --line: #24324c; --line2: #33445f;
  --brand: #ff7a2e; --side: #08101e; --side-ink: #9eacc4; --side-act: #16233b; --side-line: #172640;
  --c-sales: #e8641a; --c-traffic: #16a08b; --c-trx: #8a74f2; --c-cr: #bd8e00; --c-bs: #4a8ef5; --c-upt: #e5588a;
  --good: #45c486; --good-bg: #123626; --warn: #f0b64a; --warn-bg: #3a2c0c; --bad: #ff8478; --bad-bg: #3d1713; --info: #7fb0ff; --info-bg: #14284b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
a { color: var(--info); }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; display: flex; flex-direction: column; padding: 18px 12px 14px; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid var(--side-line); }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; letter-spacing: -.02em; flex: none; }
.brand-t { color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .02em; line-height: 1.15; }
.brand-s { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--side-ink); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--side-ink); padding: 9px 10px; border-radius: 10px; cursor: pointer; text-align: left; font-weight: 600; font-size: 13px; width: 100%; }
.nav button:hover { background: var(--side-act); color: #fff; }
.nav button[aria-current="page"] { background: var(--side-act); color: #fff; box-shadow: inset 3px 0 0 var(--brand); }
.nav .ni { width: 20px; height: 20px; flex: none; opacity: .9; }
.nav .nb { margin-left: auto; font-family: var(--mono); font-size: 10px; background: var(--bad); color: #fff; padding: 1px 6px; border-radius: 99px; }
.side-foot { margin-top: auto; font-size: 11px; color: var(--side-ink); padding: 10px 8px 0; border-top: 1px solid var(--side-line); display: grid; gap: 4px; }
.side-foot b { color: #fff; font-weight: 600; }

.main { min-width: 0; padding: 0 28px 40px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); padding: 14px 0 10px; display: grid; gap: 10px; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.page-t { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.grow { flex: 1; min-width: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.fld { display: grid; gap: 3px; min-width: 0; }
.fld > span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
select, input[type=text], input[type=search], input[type=number], input[type=date], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0; }
select:hover, input:hover { border-color: var(--line2); }
.filters select, .filters input { width: auto; min-width: 110px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; min-height: 38px; font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--ink2); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12px; border-radius: 8px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn svg { width: 16px; height: 16px; }
.iconbtn { width: 38px; padding: 0; }
.note-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink2); }

.page { display: grid; gap: 18px; padding-top: 14px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-ko { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; display: grid; gap: 12px; align-content: start; }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.card-h .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.sec-t { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); display: flex; align-items: center; gap: 8px; }
.sec-t::after { content: ''; height: 1px; background: var(--line); flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.right { margin-left: auto; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 10px; }
.scroll-x { overflow-x: auto; }

/* badges */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface2); color: var(--ink2); white-space: nowrap; }
.pill.good, .pill.pos { background: var(--good-bg); color: var(--good); }
.pill.warn, .pill.neg-med { background: var(--warn-bg); color: var(--warn); }
.pill.bad, .pill.neg-high { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.neg-low { background: var(--surface2); color: var(--ink2); }
.pill.neutral { background: var(--surface2); color: var(--muted); }
.pill.HIGH { background: var(--bad-bg); color: var(--bad); }
.pill.MEDIUM { background: var(--warn-bg); color: var(--warn); }
.pill.LOW { background: var(--info-bg); color: var(--info); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: #e39b00; } .dot.bad { background: var(--bad); }

/* KPI cards */
.kpi { position: relative; overflow: hidden; border-radius: 16px; padding: 14px 16px 12px; border: 1px solid color-mix(in srgb, var(--kc) 28%, var(--line)); background: color-mix(in srgb, var(--kc) 10%, var(--surface)); display: grid; gap: 4px; min-width: 0; cursor: default; }
.kpi.main { background: var(--kc); border-color: var(--kc); color: #fff; }
.kpi.main .kl, .kpi.main .ks, .kpi.main .kd { color: rgba(255, 255, 255, .86); }
.kpi.main .spark path { stroke: #fff !important; fill: #fff; }
.kl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.kl i { width: 8px; height: 8px; border-radius: 50%; background: var(--kc); display: inline-block; }
.kpi.main .kl i { background: #fff; }
.kv { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ks { font-size: 11.5px; color: var(--ink2); }
.kd { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; flex-wrap: wrap; }
.kd .chg { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.chg.up { background: var(--good-bg); color: var(--good); } .chg.down { background: var(--bad-bg); color: var(--bad); } .chg.flat { background: var(--surface2); color: var(--muted); }
.kpi.main .chg { background: rgba(255, 255, 255, .22); color: #fff; }
.spark { width: 100%; height: 30px; display: block; margin-top: 2px; }

/* charts */
.chart { width: 100%; position: relative; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10.5px; font-family: var(--font); }
.chart .axs { font-size: 10px; font-family: var(--mono); }
.chart .ref { stroke-width: 1.2; stroke-dasharray: 4 4; }
.chart .mark { stroke-width: 3; stroke-linecap: round; }
.chart .cross { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hlight { fill: var(--ink); opacity: .06; }
.chart .bar { transition: opacity .1s; }
.chart-empty { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
#tt { position: fixed; z-index: 100; pointer-events: none; display: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 130px; max-width: 280px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
#tt .tt-h { font-weight: 700; margin-bottom: 4px; }
#tt .tt-r { display: flex; align-items: center; gap: 7px; padding: 1px 0; }
#tt .tt-r i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
#tt .tt-r i.tick { height: 3px; }
#tt .tt-r span { flex: 1; opacity: .85; }
#tt .tt-r b { font-variant-numeric: tabular-nums; }
#tt .tt-x { margin-top: 4px; opacity: .8; font-size: 11px; }
.ring { display: block; }
.ring-n { font-size: 34px; font-weight: 800; fill: var(--ink); font-family: var(--font); }
.ring-s { font-size: 10px; fill: var(--muted); font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; }

/* diverging driver bars */
.dv { display: grid; gap: 10px; }
.dv-row { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.dv-l { font-weight: 700; font-size: 13px; line-height: 1.25; }
.dv-l small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
.dv-track { position: relative; height: 22px; background: var(--surface2); border-radius: 8px; }
.dv-track::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line2); }
.dv-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 6px; min-width: 3px; }
.dv-v { font-size: 12px; text-align: right; display: grid; gap: 2px; justify-items: end; min-width: 120px; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.hl td { background: color-mix(in srgb, var(--brand) 8%, var(--surface)); }
.tbl td.wrap { white-space: normal; text-align: left; min-width: 220px; }
.tbl .pos { color: var(--good); font-weight: 700; } .tbl .neg { color: var(--bad); font-weight: 700; }
.tbl input { min-height: 32px; padding: 4px 8px; text-align: right; width: 150px; }

/* insight card */
.ins { border: 1px solid var(--line); border-left: 4px solid var(--ic, var(--line2)); border-radius: 14px; padding: 14px 16px; background: var(--surface); display: grid; gap: 10px; min-width: 0; }
.ins.HIGH { --ic: var(--bad); } .ins.MEDIUM { --ic: #e39b00; } .ins.LOW { --ic: var(--info); }
.ins h3 { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.ins-grid { display: grid; gap: 8px; }
.ins-r { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.ins-r.wide { grid-template-columns: 138px minmax(0, 1fr); }
.ins-k { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 2px; }
.ins-v { overflow-wrap: anywhere; }
.ins-v.ev { white-space: pre-line; font-size: 12.5px; color: var(--ink2); }
.callout { border-radius: 12px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--line); }
.callout.good { background: var(--good-bg); border-color: transparent; } .callout.warn { background: var(--warn-bg); border-color: transparent; } .callout.bad { background: var(--bad-bg); border-color: transparent; } .callout.info { background: var(--info-bg); border-color: transparent; }
.callout b { font-weight: 800; }
.quote { font-size: 15px; font-weight: 600; line-height: 1.5; }

/* hero / brief */
.brief { border-radius: 20px; padding: 20px 22px; background: linear-gradient(135deg, #0d1b33 0%, #16305a 60%, #1f3f73 100%); color: #eaf1ff; display: grid; gap: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.brief::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--brand) 40%, transparent), transparent 70%); pointer-events: none; }
.brief .eyebrow { color: #9fb3d6; }
.brief h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #fff; }
.brief-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; position: relative; z-index: 1; }
.brief-i { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .1); border-radius: 12px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; }
.brief-i .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #9fb3d6; }
.brief-i .v { font-size: 13px; line-height: 1.4; color: #f2f6ff; overflow-wrap: anywhere; }
.brief-i.bact { grid-column: 1 / -1; background: color-mix(in srgb, var(--brand) 26%, transparent); border-color: color-mix(in srgb, var(--brand) 55%, transparent); }
.brief .dot { width: 12px; height: 12px; box-shadow: 0 0 0 4px rgba(255, 255, 255, .12); }

/* score */
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.parts { display: grid; gap: 7px; }
.part { display: grid; grid-template-columns: 86px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 12px; }
.meter { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--surface2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.fact .k { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fact .v { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }

/* actions */
.act { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act-n { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; }
.act h4 { font-size: 14px; font-weight: 800; }
.act .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
.act ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink2); font-size: 12.5px; }

/* tabs */
.tabs { display: flex; gap: 4px; background: var(--surface2); padding: 4px; border-radius: 12px; overflow-x: auto; max-width: 100%; }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 700; cursor: pointer; color: var(--ink2); white-space: nowrap; font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line2); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* heat */
.heat { display: grid; gap: 3px; font-size: 12px; }
.heat-r { display: grid; gap: 3px; }
.heat-c { border-radius: 7px; padding: 7px 4px; text-align: center; background: color-mix(in srgb, var(--hc) calc(var(--hi) * 70% + 6%), var(--surface)); font-variant-numeric: tabular-nums; font-weight: 600; min-width: 0; }
.heat-h { color: var(--muted); font-family: var(--mono); font-size: 10px; text-align: center; letter-spacing: .06em; }
.heat-l { color: var(--ink2); font-weight: 700; display: flex; align-items: center; }

/* quadrant matrix */
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.q { border-radius: 14px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 6px; align-content: start; }

  /* ============ weekday table ============ */

  /* ============ lost sales ============ */
  function lostSales(recs, hist, a, settings, time, wd) {
    const real = settings.realization;
    const valid = (rr) => rr.filter((r) => r.cr != null && !r.bad);
    const base = hist.length >= 14 ? hist : recs;
    const crs = valid(base).filter((r) => r.inT >= 8).map((r) => r.cr);
    const bss = base.filter((r) => r.bs != null && r.trxT >= 5 && !r.bad).map((r) => r.bs);
    const ins = base.filter((r) => r.inT != null && !r.bad).map((r) => r.inT);
    const upts = base.filter((r) => r.upt != null && r.trxT >= 5).map((r) => r.upt);
    const bench = { cr: quantile(crs, 0.75), bs: quantile(bss, 0.75), inMed: median(ins), upt: quantile(upts, 0.75), crMed: median(crs), bsMed: median(bss) };
    if (!a || !a.days || !a.netPerTrx) return { bench, ok: false };
    const npt = a.netPerTrx;
    // case 1: conversion gap, day level
    let lostTrx = 0, daysBelow = 0;
    recs.forEach((r) => { if (r.cr != null && !r.bad && r.inT >= 8 && r.cr < bench.cr) { lostTrx += r.inT * (bench.cr - r.cr); daysBelow++; } });
    const conv = { lostTrx, lostNet: lostTrx * npt, daysBelow, bench: bench.cr };

    if (time) {

        const lt = s.IN * (bench.cr - s.cr);

    recs.forEach((r) => { if (r.bs != null && !r.bad && r.trxT >= 5 && r.bs < bench.bs) { bsGap += r.trxT * (bench.bs - r.bs) * (r.disc || a.disc || 1); bsDays++; } });

    recs.forEach((r) => { if (!r.bad && r.inT != null && r.inT < bench.inMed) { tGap += (bench.inMed - r.inT) * (a.cr || 0) * npt; tDays++; } });

        const ht = w.inT / w.days >= avgIN, hc = w.cr >= allCR, lb = w.bs < allBS * 0.97;
        if (!ht && w.cr >= allCR * 1.05) cases.push({ type: 3, dow: w.dow, name: w.name, w });
        else if (ht && hc && lb) cases.push({ type: 4, dow: w.dow, name: w.name, w });
        else if (ht && !hc) cases.push({ type: 1, dow: w.dow, name: w.name, w });

    return { ok: true, bench, conv, convSlots, basket, traffic, uptGap: uptGap * real, uptGapMax: uptGap, cases, npt, real };
  }

  /* ============ best / worst days ============ */
  function bestWorst(recs, schemas) {
    const R = recs.filter((r) => r.net != null && !r.bad);
    if (R.length < 8) return { ok: false, n: R.length };
    const k = Math.min(10, Math.floor(R.length / 3));

  /* ============ anomalies ============ */
  function anomalies(recs, hist) {
    const H = hist.filter((r) => !r.bad);

    const baseAgg = agg(H);
    const defs = [
      { k: 'net', label: 'Net sales', f: (r) => r.net, log: true, fmt: F.rp },
      { k: 'inT', label: 'Traffic', f: (r) => r.inT, log: true, fmt: (v) => F.n(v) },
      { k: 'trxT', label: 'Transaksi', f: (r) => r.trxT, log: true, fmt: (v) => F.n(v) },
      { k: 'cr', label: 'CR', f: (r) => r.cr, log: false, fmt: (v) => F.pct(v) },
      { k: 'bs', label: 'BS', f: (r) => r.bs, log: true, fmt: F.rp }

        const v = d.f(r);

        const z = (0.6745 * ((d.log ? Math.log(v) : v) - stats[d.k].med)) / stats[d.k].mad;

        evidence: s.IN + ' IN, ' + s.trx + ' transaksi dalam ' + s.days + ' hari; share traffic ' + F.pct(s.shareIN, 0), impact: 'Share traffic ' + F.pct(s.shareIN, 0) + ' dan share transaksi ' + F.pct(s.shareTrx, 0) + '.', impactRp: 0, action: C.QUAD.critical.rec, metric: 'Traffic & CR per jam', period: R.A.label, comparison: 'rata-rata toko', magnitude: F.pp(s.cr - time.overallCR)
      }));
      topp.filter((s) => !s.marginal).forEach((s) => out.push({
        id: 'topp' + s.j, kind: 'time', priority: 'MEDIUM', confidence: s.IN >= 40 ? 'Medium' : 'Low', title: 'Traffic Opportunity ' + s.label,
        what: 'Pada ' + s.label + ' traffic di bawah rata-rata (' + F.n(s.inPerHour, 1) + ' IN/jam) tetapi CR tinggi (' + F.pct(s.cr) + ').', why: 'Selling capability pada jam ini baik; opportunity terbesar berada pada traffic acquisition.',
        evidence: s.IN + ' IN dan ' + s.trx + ' transaksi dalam ' + s.days + ' hari.', impact: 'Jika traffic naik 10% dengan CR tetap, tambahan sekitar ' + F.n(s.trx * 0.1, 0) + ' transaksi selama periode.', impactRp: s.trx * 0.1 * (a.netPerTrx || 0),
        action: C.QUAD.trafficopp.rec, metric: 'Traffic per jam', period: R.A.label, comparison: 'rata-rata toko', magnitude: F.pp(s.cr - time.overallCR)
      }));
    }

    // 3. lost sales
    if (lost && lost.ok) {
      if (lost.conv.lostNet / netTot >= 0.02) out.push({
        id: 'lostconv', kind: 'lost', priority: lost.conv.lostNet / netTot >= 0.06 ? 'HIGH' : 'MEDIUM', confidence: a.days >= 14 ? 'Medium' : 'Low', title: 'Lost sales dari konversi: ' + F.rpc(lost.conv.lostNet),
        what: lost.conv.daysBelow + ' dari ' + a.days + ' hari memiliki CR di bawah benchmark terbaik toko (' + F.pct(lost.bench.cr) + ').', why: 'Traffic sudah datang, tetapi sebagian tidak menjadi transaksi. Likely driven by variasi layanan antar hari dan jam.',
        evidence: 'CR periode ' + F.pct(a.cr) + ' vs benchmark ' + F.pct(lost.bench.cr) + ' (kuartil atas CR harian toko).', impact: 'Estimasi tambahan ' + F.n(lost.conv.lostTrx, 0) + ' transaksi atau ' + F.rpc(lost.conv.lostNet) + ' net bila semua hari mencapai benchmark (maksimum teoritis).', impactRp: lost.conv.lostNet * lost.real,
        action: 'Fokus konversi pada hari dan jam dengan CR di bawah benchmark: greeting 30 detik pertama, bantu trial, dan tutup transaksi dengan penawaran add-on.', metric: 'CR', period: R.A.label, comparison: 'benchmark toko', magnitude: F.pp(lost.bench.cr - a.cr)
      });
      if (lost.basket.potential / netTot >= 0.02) out.push({
        id: 'lostbs', kind: 'lost', priority: lost.basket.potential / netTot >= 0.08 ? 'HIGH' : 'MEDIUM', confidence: a.days >= 14 ? 'Medium' : 'Low', title: 'Potensi basket: ' + F.rpc(lost.basket.potential),
        what: lost.basket.daysBelow + ' hari memiliki BS di bawah benchmark ' + F.rp(lost.basket.bench) + ' (kuartil atas BS harian toko).', why: 'Transaksi terjadi, tetapi nilai belanja per customer belum optimal. Associated with UPT dan nilai per item.',
        evidence: 'BS periode ' + F.rp(a.bs) + ', UPT ' + F.n(a.upt, 2) + ', rata-rata harga per item ' + F.rp(a.asp), impact: 'Potensi maksimum ' + F.rpc(lost.basket.potential) + '; dengan realisasi ' + F.pct(lost.real, 0) + ' sekitar ' + F.rpc(lost.basket.realistic) + ' net.', impactRp: lost.basket.realistic,
        action: 'Cross-selling dan add-on selling di kasir, bundling produk komplementer (misalnya aksesori dengan produk utama).', metric: 'BS', period: R.A.label, comparison: 'benchmark toko', magnitude: F.spct(lost.basket.bench / a.bs - 1, 0)
      });
      if (lost.traffic.potential / netTot >= 0.03) out.push({
        id: 'losttraffic', kind: 'lost', priority: lost.traffic.potential / netTot >= 0.1 ? 'HIGH' : 'MEDIUM', confidence: a.days >= 14 ? 'Medium' : 'Low', title: 'Potensi traffic: ' + F.rpc(lost.traffic.potential),
        what: lost.traffic.daysBelow + ' hari memiliki traffic di bawah median toko (' + F.n(lost.bench.inMed, 1) + ' IN/hari).', why: 'Hari dengan traffic rendah membatasi sales walau CR dan BS normal.', evidence: 'Traffic rata-rata ' + F.n(a.pd.inT, 1) + ' IN/hari vs median ' + F.n(lost.bench.inMed, 1),
        impact: 'Bila hari lemah naik ke median: ' + F.rpc(lost.traffic.potential) + ' (realisasi ' + F.pct(lost.real, 0) + ' = ' + F.rpc(lost.traffic.realistic) + ').', impactRp: lost.traffic.realistic, action: 'Aktifkan campaign terjadwal pada hari lemah dan broadcast ke database customer sehari sebelumnya.', metric: 'Traffic', period: R.A.label, comparison: 'median toko', magnitude: F.spct(lost.bench.inMed / a.pd.inT - 1, 0)
      });
    }

    // 4. target
    const tt = ptarget;
    if (tt) {
      const behind = tt.ach < 1;
      const mtd = tstat && tstat.target;
      const pace = tstat && tstat.pace;
      out.push({
        id: 'target', kind: 'target', priority: behind ? (tt.ach < 0.8 && !(mtd && tstat.partial) ? 'HIGH' : tstat && tstat.partial && pace < 0.9 ? 'HIGH' : 'MEDIUM') : 'LOW', confidence: 'High', title: behind ? 'Masih minus ' + F.rpc(-tt.gap) + ' dari target' : 'Target terlampaui ' + F.rpc(tt.gap),
        what: 'Pencapaian ' + F.pct(tt.ach) + ' dari target ' + (tt.basis === 'net' ? 'net' : 'gross') + ' ' + F.rpc(tt.target) + ' (' + F.rpc(tt.actual) + ' tercapai).',
        why: behind ? (tstat && tstat.partial ? 'Pace saat ini ' + F.pct(pace, 0) + ' dari yang dibutuhkan pada hari ke-' + tstat.elapsed + '.' : 'Bulan sudah selesai di bawah target.') : 'Target tercapai berdasarkan data yang tercatat.', evidence: tstat && tstat.partial ? 'Run-rate ' + F.rpc(tstat.runPerDay) + '/hari; butuh ' + F.rpc(tstat.needPerDay) + '/hari untuk ' + tstat.remaining + ' hari tersisa.' : 'Target ' + F.rp(tt.target) + ', aktual ' + F.rp(tt.actual),
        impact: behind ? 'Gap ' + F.rp(-tt.gap) + '.' : 'Surplus ' + F.rp(tt.gap) + '.', impactRp: behind ? -tt.gap : 0,
        action: behind && tstat && tstat.partial ? 'Buka Target Simulator untuk melihat kombinasi traffic, CR, dan BS yang dibutuhkan pada ' + tstat.remaining + ' hari tersisa.' : behind ? 'Evaluasi penyebab gap pada bulan ini dan tetapkan korektif untuk bulan berikutnya.' : 'Pertahankan momentum dan evaluasi apa yang berhasil.', metric: 'Pencapaian target', period: R.A.label, comparison: 'target bulanan', magnitude: F.pct(tt.ach, 0)
      });
    }

    // 5. anomalies
    if (an && an.ok && an.items.length) {
      an.items.slice(0, 3).forEach((it, i) => {
        const h = it.hits.find((x) => x.k === 'net') || it.hits[0];
        const d = it.dec;
        const lead = d ? d.ranked[0] : null;
        out.push({
          id: 'anom' + i, kind: 'anomaly', priority: 'LOW', confidence: 'Medium', title: 'Anomali ' + F.date(it.r.date, true) + ': ' + h.label + ' ' + F.spct(h.dev, 0),
          what: h.label + ' ' + F.dshort(it.r.date) + ' = ' + h.fmt(h.v) + ', ' + F.pct(Math.abs(h.dev), 0) + (h.dev > 0 ? ' di atas' : ' di bawah') + ' nilai normal (median ' + h.fmt(h.med) + ').',
          why: lead ? 'Indicates perubahan terbesar berasal dari ' + lead.label.toLowerCase() + ' (' + F.spct(lead.chg, 0) + ' vs rata-rata toko).' + (h.k === 'bs' && h.dev > 1 ? ' Kemungkinan ada pembelian bernilai besar (mis. wholesale atau korporat); perlu dikonfirmasi.' : '') : 'Insufficient data to determine root cause.',
          evidence: it.hits.map((x) => x.label + ' ' + x.fmt(x.v) + ' (' + F.spct(x.dev, 0) + ')').join('; '), impact: 'Dampak ke periode: ' + F.srp(((it.r.net || 0) - (an.baseAgg.pd.net || 0))) + ' dibanding hari normal.', impactRp: 0,
          action: 'Konfirmasi penyebab hari ini (promo, event, transaksi besar atau salah input). Jika berulang dan bisa direplikasi, jadikan playbook.', metric: h.label, period: F.date(it.r.date), comparison: 'baseline historis toko (' + an.n + ' hari)', magnitude: F.spct(h.dev, 0)
        });
      });
    }

    // 6. patterns
    if (pat && pat.items) pat.items.slice(0, 4).forEach((p) => out.push({
      id: p.id, kind: 'pattern', priority: 'LOW', confidence: p.confidence, title: p.title, what: p.what, why: p.why, evidence: p.comparison + (p.p != null ? '; p ≈ ' + F.n(p.p, 3) : ''), impact: 'Besaran: ' + (typeof p.mag === 'number' ? (Math.abs(p.mag) < 1.5 ? F.spct(p.mag, 0) : F.n(p.mag, 2)) : '–'), impactRp: 0, action: p.action, metric: p.metric, period: p.period, comparison: p.comparison, magnitude: typeof p.mag === 'number' ? F.n(p.mag, 2) : ''
    }));

    // 7. data quality
    if (health && health.badDays) out.push({
      id: 'dq', kind: 'dq', priority: 'MEDIUM', confidence: 'High', title: health.badDays + ' hari berisi data yang tidak konsisten',
      what: 'Ada hari dengan transaksi > IN atau Net > Gross.', why: 'Kemungkinan salah input. Hari tersebut ' + (st.excludeBad ? 'dikecualikan dari hitungan field yang bermasalah (IN/CR atau Net) agar analisis tidak bias.' : 'tetap dihitung apa adanya (pengecualian dimatikan).'),
      evidence: 'Lihat halaman Data & Input › Data Health.', impact: 'Membuat CR, traffic, dan net sales tidak akurat pada bulan terkait.', impactRp: 0, action: 'Perbaiki input pada hari yang ditandai lalu simpan ulang.', metric: 'Kualitas data', period: 'seluruh data', comparison: '–', magnitude: String(health.badDays)
    });
    return out;
  }

  /* ---------- top actions ---------- */
  function buildActions(X, insights) {
    const { a, b, dec, time, timeCmp, lost, pat, tstat, ptarget, st, R } = X;
    const net = a.net || 1;
    const cand = [];
    const imp = (rp) => { const p = (rp || 0) / net; return p >= 0.08 ? 5 : p >= 0.05 ? 4 : p >= 0.03 ? 3 : p >= 0.015 ? 2 : 1; };
    const trafficNeg = dec && dec.factors.find((f) => f.key === 'traffic' && f.contrib < 0 && Math.abs(f.pctS0) >= 0.03);
    const crNeg = dec && dec.factors.find((f) => f.key === 'cr' && f.contrib < 0 && Math.abs(f.pctS0) >= 0.02);
    const bsNeg = dec && dec.factors.find((f) => f.key === 'bs' && f.contrib < 0 && Math.abs(f.pctS0) >= 0.03);
    const discNeg = dec && dec.factors.find((f) => f.key === 'disc' && f.contrib < 0 && Math.abs(f.pctS0) >= 0.015);
    const behind = ptarget && ptarget.ach < 1 ? 1 - ptarget.ach : 0;
    const urg = (negFactor, base) => Math.min(5, base + (negFactor ? (Math.abs(negFactor.pctS0) >= 0.08 ? 2 : 1) : 0) + (behind > 0.15 ? 1 : 0));
    const slotWeak = timeCmp ? timeCmp.filter((t) => !t.lowA && !t.lowB && t.inChg != null).sort((x, y) => x.inChg - y.inChg)[0] : null;
    const trafficSlots = time ? time.slots.filter((s) => s.quad === 'trafficopp' || s.quad === 'critical').map((s) => s.label) : [];
    const slotName = slotWeak && slotWeak.inChg < -0.1 ? slotWeak.label : trafficSlots[0] || (time && time.dead && !time.dead.low ? time.dead.label : null);

    if (lost && lost.ok) {
      cand.push({
        key: 'traffic', title: 'Naikkan traffic' + (slotName ? ' pada ' + slotName : ' pada hari dan jam lemah'),
        why: trafficNeg ? 'Traffic adalah penekan sales terbesar (' + F.spct(trafficNeg.chg, 0) + ').' : 'Traffic di bawah median pada ' + lost.traffic.daysBelow + ' hari.',
        evidence: slotWeak && slotWeak.inChg < -0.1 ? slotWeak.label + ' turun ' + F.pct(Math.abs(slotWeak.inChg), 0) + ' (IN/hari ' + F.n(slotWeak.prevAvgIN, 1) + ' → ' + F.n(slotWeak.avgIN, 1) + ')' : 'Traffic ' + F.n(a.pd.inT, 1) + ' IN/hari vs median toko ' + F.n(lost.bench.inMed, 1),
        expected: 'Traffic +10% menambah sekitar ' + F.rpc(a.net * 0.1) + ' net per periode bila CR dan BS tetap; potensi realistis dari hari lemah ' + F.rpc(lost.traffic.realistic) + '.',
        kpi: 'Traffic +10%, Transaksi +8%, Net sales +10%', impactRp: Math.max(lost.traffic.realistic, trafficNeg ? -trafficNeg.rp * 0.5 : 0), feas: 3, urg: urg(trafficNeg, 3), steps: ['Campaign dan konten sosial media 1–2 jam sebelum jam lemah', 'Broadcast ke database customer (WhatsApp)', 'Aktivasi komunitas/event kecil di sekitar toko']
      });
      cand.push({
        key: 'conv', title: 'Perbaiki konversi pada jam ramai',
        why: crNeg ? 'CR turun ' + F.pct(Math.abs(crNeg.chg), 0) + ' dibanding pembanding.' : 'CR ' + F.pct(a.cr) + ' masih di bawah benchmark terbaik toko ' + F.pct(lost.bench.cr) + '.',
        evidence: lost.convSlots.length ? lost.convSlots.slice(0, 2).map((s) => s.label + ' CR ' + F.pct(s.cr) + ' (' + s.IN + ' IN)').join('; ') : lost.conv.daysBelow + ' hari dengan CR di bawah benchmark',
        expected: 'Potensi ' + F.n(lost.conv.lostTrx, 0) + ' transaksi tambahan (maks), setara ' + F.rpc(lost.conv.lostNet * lost.real) + ' net pada realisasi ' + F.pct(lost.real, 0) + '.',
        kpi: 'CR ≥ ' + F.pct(Math.max(st.crTarget, a.cr || 0), 0) + ' pada jam ramai', impactRp: lost.conv.lostNet * lost.real, feas: 4, urg: urg(crNeg, 3), steps: ['Staf terbaik di floor saat jam ramai', 'Greeting dan approach 30 detik pertama', 'Cek size dan stok produk yang paling dicari']
      });
      cand.push({
        key: 'bs', title: 'Naikkan BS lewat cross-selling dan bundling',
        why: bsNeg ? 'BS turun ' + F.pct(Math.abs(bsNeg.chg), 0) + ' dan menekan sales.' : 'BS ' + F.rp(a.bs) + (a.bs < st.bsTarget ? ' di bawah target ' + F.rp(st.bsTarget) : ' masih bisa diangkat ke benchmark ' + F.rp(lost.basket.bench)) + '.',
        evidence: 'UPT ' + F.n(a.upt, 2) + ' (target ' + F.n(st.uptTarget, 2) + '), harga per item ' + F.rp(a.asp),
        expected: 'Potensi ' + F.rpc(lost.basket.realistic) + ' net (realisasi ' + F.pct(lost.real, 0) + ' dari ' + F.rpc(lost.basket.potential) + ').',
        kpi: 'BS ≥ ' + F.rp(Math.max(st.bsTarget, a.bs || 0)) + ', UPT ≥ ' + F.n(st.uptTarget, 2), impactRp: lost.basket.realistic, feas: 4, urg: urg(bsNeg, 3), steps: ['Add-on wajib ditawarkan di kasir', 'Bundling produk komplementer', 'Script upsell ke varian bernilai lebih tinggi']
      });
      cand.push({
        key: 'db', title: 'Aktivasi database customer lama',
        why: 'Cara tercepat dan termurah menambah traffic tanpa biaya iklan.', evidence: 'Traffic ' + F.n(a.pd.inT, 1) + ' IN/hari; CR customer yang datang ' + F.pct(a.cr) + ' menunjukkan kemampuan menjual cukup baik.',
        expected: 'Setiap +1 IN/hari dengan CR ' + F.pct(a.cr, 0) + ' menambah sekitar ' + F.rpc(a.cr * a.netPerTrx * (R.A.calDays || a.days)) + ' net per periode.', kpi: 'Traffic +10%, jumlah customer repeat', impactRp: lost.traffic.realistic * 0.5, feas: 4, urg: urg(trafficNeg, 2), steps: ['Broadcast promo/produk baru terjadwal', 'Undang customer ke event atau preview', 'Catat nomor customer di setiap transaksi']
      });
    }
    // weekend conversion pattern
    const wp = pat && pat.items ? pat.items.find((p) => p.id === 'weCR' && p.mag < 0) : null;
    if (wp) {
      const R2 = X.A_recs.filter((r) => r.cr != null && !r.bad);
      const we = R2.filter((r) => r.dow === 0 || r.dow === 6), wk = R2.filter((r) => r.dow >= 1 && r.dow <= 5);
      const gap = mean(wk.map((r) => r.cr)) - mean(we.map((r) => r.cr));
      const rp = gap * sum(we.map((r) => r.inT || 0)) * (a.netPerTrx || 0) * (lost ? lost.real : 0.5);
      cand.push({ key: 'weekend', title: 'Perbaiki konversi weekend', why: 'CR weekend ' + F.spct(wp.mag, 0) + ' dibanding weekday.', evidence: wp.what, expected: 'Menyamai CR weekday menambah sekitar ' + F.rpc(rp) + ' net.', kpi: 'CR weekend ≥ CR weekday', impactRp: rp, feas: 3, urg: 3, steps: ['Tambah staf floor pada weekend', 'Jadwalkan istirahat staf di luar jam puncak'] });
    }
    // discount
    if (discNeg) cand.push({ key: 'disc', title: 'Disiplinkan diskon dan promo', why: 'Rasio Net ÷ Gross turun ' + F.pct(Math.abs(discNeg.chg), 1) + ' sehingga net sales tergerus.', evidence: 'Net ÷ Gross ' + F.pct(discNeg.v0) + ' → ' + F.pct(discNeg.v1), expected: 'Mengembalikan rasio ke level sebelumnya menambah ' + F.rpc(-discNeg.rp) + ' net.', kpi: 'Net ÷ Gross ≥ ' + F.pct(discNeg.v0, 1), impactRp: -discNeg.rp, feas: 5, urg: urg(discNeg, 3), steps: ['Audit diskon manual', 'Batasi promo yang tidak menambah volume'] });
    // target catch-up
    if (tstat && tstat.target && tstat.partial && tstat.ach < 1) cand.push({ key: 'target', title: 'Kejar target bulan ini: ' + F.rpc(tstat.needPerDay) + '/hari', why: 'Masih minus ' + F.rpc(-tstat.gap) + ' dengan ' + tstat.remaining + ' hari tersisa.', evidence: 'Run-rate ' + F.rpc(tstat.runPerDay) + '/hari vs kebutuhan ' + F.rpc(tstat.needPerDay) + '/hari.', expected: 'Menutup gap ' + F.rpc(-tstat.gap) + ' bila kebutuhan harian tercapai.', kpi: 'Sales harian ≥ ' + F.rpc(tstat.needPerDay), impactRp: -tstat.gap, feas: 3, urg: 5, steps: ['Gunakan Target Simulator untuk kombinasi traffic/CR/BS', 'Tetapkan target harian per shift'] });
    cand.forEach((c) => { c.impS = imp(c.impactRp); c.score = c.impS * c.feas * c.urg; c.priority = c.score >= 45 ? 'HIGH' : c.score >= 20 ? 'MEDIUM' : 'LOW'; });
    cand.sort((x, y) => y.score - x.score);
    return cand.slice(0, 5);
  }

  /* ---------- PICA ---------- */
  function buildPICA(X, actions, lang) {
    const { a, b, dec, narr, R, time, timeCmp, lost, tstat, ptarget, st } = X;
    const en = lang === 'en';
    if (!dec || !b) return null;
    const main = dec.main;
    const neg = dec.delta < 0;
    const ok = enough(a, b);
    const slotWeak = timeCmp ? timeCmp.filter((t) => !t.lowA && !t.lowB && t.inChg != null).sort((x, y) => x.inChg - y.inChg)[0] : null;
    const word = { id: { traffic: 'traffic', cr: 'conversion rate (CR)', bs: 'basket size (BS)', disc: 'tingkat potongan (Net ÷ Gross)' }, en: { traffic: 'traffic', cr: 'conversion rate (CR)', bs: 'basket size (BS)', disc: 'discount depth (Net ÷ Gross)' } }[en ? 'en' : 'id'];
    const calm = dec.factors.filter((f) => f.key !== main.key && Math.abs(f.pctS0) < 0.03).map((f) => word[f.key]);
    const pct = F.pct(Math.abs(dec.pct));
    const tg = ptarget ? (en ? ' Achievement vs target: ' + F.pct(ptarget.ach, 0) + ' (' + (ptarget.gap < 0 ? 'short by ' : 'ahead by ') + F.rpc(Math.abs(ptarget.gap)) + ').' : ' Pencapaian terhadap target: ' + F.pct(ptarget.ach, 0) + ' (' + (ptarget.gap < 0 ? 'minus ' : 'surplus ') + F.rpc(Math.abs(ptarget.gap)) + ').') : '';
    const state = narr.state;
    let problem, root, corr, exp, kpi;
    if (en) {
      problem = 'Net sales ' + (state === 'flat' ? 'remained stable (' + F.spct(dec.pct) + ')' : (neg ? 'decreased ' : 'increased ') + pct) + ' ' + R.A.label + ' vs ' + R.B.label + (dec.main && state !== 'flat' ? ', primarily driven by ' + (main.chg < 0 ? 'a ' : 'a ') + F.pct(Math.abs(main.chg)) + ' ' + (main.chg < 0 ? 'decline' : 'increase') + ' in ' + word[main.key] : '') + (calm.length && state !== 'flat' ? ' while ' + calm.join(' and ') + ' remained relatively stable' : '') + '.' + tg;
    } else {
      problem = 'Net sales ' + (state === 'flat' ? 'relatif stabil (' + F.spct(dec.pct) + ')' : (neg ? 'turun ' : 'naik ') + pct) + ' pada ' + R.A.label + ' dibanding ' + R.B.label + (state !== 'flat' ? ', terutama didorong oleh ' + word[main.key] + ' yang ' + (main.chg < 0 ? 'turun ' : 'naik ') + F.pct(Math.abs(main.chg)) : '') + (calm.length && state !== 'flat' ? ', sementara ' + calm.join(' dan ') + ' relatif stabil' : '') + '.' + tg;
    }
    const needs = en ? 'Insufficient data to determine root cause. Required: at least 7 days of data in both periods, plus a log of promotions, events, and staffing changes.' : 'Insufficient data to determine root cause. Data yang dibutuhkan: minimal 7 hari data pada kedua periode, serta catatan promo, event, dan perubahan staf.';
